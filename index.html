<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryTV Full Merger (ffmpeg.wasm)</title>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
    body{background:#0f0f13;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .box{background:#1a1a22;border-radius:16px;padding:24px;width:100%;max-width:480px}
    h1{font-size:18px;color:#fff;margin-bottom:6px}
    p{font-size:13px;color:#888;margin-bottom:16px}
    input,select{width:100%;padding:12px 14px;border-radius:10px;border:none;background:#2a2a35;color:#fff;font-size:14px;margin-bottom:10px}
    button{width:100%;padding:14px;border-radius:10px;border:none;background:#6c5ce7;color:#fff;font-size:15px;font-weight:600;margin-bottom:8px;cursor:pointer}
    button:disabled{background:#444;cursor:not-allowed}
    .progress{height:8px;background:#2a2a35;border-radius:4px;overflow:hidden;margin:14px 0 8px;display:none}
    .bar{height:100%;background:#6c5ce7;width:0%;transition:width .2s}
    .status{font-size:13px;color:#aaa;min-height:20px;word-break:break-all}
    .error{color:#ff6b6b}
    .success{color:#2ecc71}
  </style>
</head>
<body>
  <div class="box">
    <h1>StoryTV Full MP4 (Video + Audio)</h1>
    <p>ffmpeg.wasm se merge hoga → ek complete file</p>

    <input type="text" id="url" placeholder="master.m3u8 link paste karo">
    <select id="quality">
      <option value="720p" selected>720p</option>
      <option value="1080p">1080p</option>
      <option value="480p">480p</option>
      <option value="360p">360p</option>
    </select>
    <input type="text" id="filename" value="storytv_full">

    <button id="loadBtn" onclick="loadFFmpeg()">1. Load FFmpeg (~30MB)</button>
    <button id="btn" onclick="start()" disabled>2. Download & Merge MP4</button>

    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">Pehle "Load FFmpeg" dabao</div>
  </div>

  <script>
    const { FFmpeg } = FFmpegWASM;
    const { toBlobURL } = FFmpegUtil;

    const $ = id => document.getElementById(id);
    const statusEl = $('status'), barEl = $('bar'), progressEl =$('progress');
    const btn = $('btn'), loadBtn =$('loadBtn');

    let ffmpeg = null;
    let loaded = false;

    function setStatus(msg, type='') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }

    async function loadFFmpeg() {
      loadBtn.disabled = true;
      setStatus('FFmpeg load ho raha hai...');

      try {
        ffmpeg = new FFmpeg();
        ffmpeg.on('log', ({ message }) => console.log(message));
        ffmpeg.on('progress', ({ progress }) => {
          if (progress > 0 && progress < 1) {
            barEl.style.width = Math.round(progress * 100) + '%';
          }
        });

        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
        const workerScriptURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js';

        // Fetch worker script and convert to blob to fix CORS worker restriction
        const classWorkerURL = await toBlobURL(workerScriptURL, 'text/javascript');

        await ffmpeg.load({
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
          classWorkerURL: classWorkerURL
        });

        loaded = true;
        btn.disabled = false;
        setStatus('FFmpeg ready! Ab link daal ke Download dabao', 'success');
      } catch (e) {
        console.error(e);
        setStatus('Load error: ' + (e.message || e), 'error');
        loadBtn.disabled = false;
      }
    }

    function resolve(base, rel) {
      try { return new URL(rel, base).href; } catch { return rel; }
    }

    async function fetchText(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }

    async function fetchBin(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error('Segment ' + r.status);
      return new Uint8Array(await r.arrayBuffer());
    }

    async function parseMaster(masterUrl, quality) {
      const text = await fetchText(masterUrl);
      const lines = text.split(/\r?\n/).map(l => l.trim());

      let videoUrl = null, audioUrl = null;

      for (const line of lines) {
        if (line.includes('TYPE=AUDIO') && line.includes('URI=')) {
          const m = line.match(/URI="([^"]+)"/);
          if (m) {
            if (line.includes('128k') || !audioUrl) audioUrl = resolve(masterUrl, m[1]);
          }
        }
      }

      for (let i = 0; i < lines.length; i++) {
        if (lines[i+1] && lines[i+1].includes(quality + '/')) {
          videoUrl = resolve(masterUrl, lines[i+1]);
          break;
        }
      }

      if (!videoUrl || !audioUrl) throw new Error('Video/Audio playlist nahi mila');
      return { videoUrl, audioUrl };
    }

    async function getSegments(playlistUrl) {
      const text = await fetchText(playlistUrl);
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let initUrl = null;
      const segments = [];

      for (const line of lines) {
        if (line.startsWith('#EXT-X-MAP:')) {
          const m = line.match(/URI="([^"]+)"/);
          if (m) initUrl = resolve(playlistUrl, m[1]);
        } else if (line && !line.startsWith('#')) {
          segments.push(resolve(playlistUrl, line));
        }
      }
      if (!initUrl) throw new Error('init.mp4 nahi mila');
      return { initUrl, segments };
    }

    async function downloadTrack(label, initUrl, segments) {
      const parts = [await fetchBin(initUrl)];
      for (let i = 0; i < segments.length; i++) {
        parts.push(await fetchBin(segments[i]));
        setStatus(`${label} downloading (${i + 1}/${segments.length})`);
      }
      let total = 0;
      for (const p of parts) total += p.length;
      const out = new Uint8Array(total);
      let offset = 0;
      for (const p of parts) {
        out.set(p, offset);
        offset += p.length;
      }
      return out;
    }

    async function start() {
      if (!loaded) return setStatus('Pehle FFmpeg load karo', 'error');

      const master = $('url').value.trim();
      const quality = $('quality').value;
      let name = $('filename').value.trim() || 'storytv_full';

      if (!master) return setStatus('Link daalo', 'error');

      btn.disabled = true;
      progressEl.style.display = 'block';
      barEl.style.width = '0%';
      setStatus('Playlists padh raha hoon...');

      try {
        const { videoUrl, audioUrl } = await parseMaster(master, quality);

        const vInfo = await getSegments(videoUrl);
        const aInfo = await getSegments(audioUrl);

        setStatus('Video download shuru...');
        const videoData = await downloadTrack('Video', vInfo.initUrl, vInfo.segments);

        setStatus('Audio download shuru...');
        const audioData = await downloadTrack('Audio', aInfo.initUrl, aInfo.segments);

        setStatus('FFmpeg mein merge ho raha hai...');
        await ffmpeg.writeFile('video.mp4', videoData);
        await ffmpeg.writeFile('audio.mp4', audioData);

        await ffmpeg.exec([
          '-i', 'video.mp4',
          '-i', 'audio.mp4',
          '-c', 'copy',
          '-map', '0:v:0',
          '-map', '1:a:0',
          '-shortest',
          'output.mp4'
        ]);

        const data = await ffmpeg.readFile('output.mp4');
        const blob = new Blob([data.buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = name + '.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();

        setStatus('Done! Full video + audio MP4 download ho gaya', 'success');
        barEl.style.width = '100%';

        await ffmpeg.deleteFile('video.mp4');
        await ffmpeg.deleteFile('audio.mp4');
        await ffmpeg.deleteFile('output.mp4');

      } catch (e) {
        console.error(e);
        setStatus('Error: ' + e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
