<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DramaFlix - Fixed Stream & Downloader</title>

  <!-- HLS.js for Stable Streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f0f13; color: #e0e0e0; min-height: 100vh; padding-bottom: 40px; }
    
    header { position: sticky; top: 0; z-index: 40; background: rgba(26, 26, 34, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #262636; padding: 12px 16px; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
    .logo-box { width: 36px; height: 36px; border-radius: 10px; background: #6c5ce7; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 20px; }
    .logo-text { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .logo-text span { color: #6c5ce7; }
    
    .search-box { display: flex; gap: 8px; flex: 1; max-width: 400px; }
    .search-box input { width: 100%; background: #1a1a22; border: 1px solid #262636; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; outline: none; }
    .search-box button { background: #6c5ce7; color: #fff; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; flex-shrink: 0; }
    
    .main-container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    .section-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ''; width: 4px; height: 16px; background: #6c5ce7; border-radius: 2px; }
    
    .horizontal-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    
    .card { flex: 0 0 140px; cursor: pointer; }
    .card-img-box { width: 100%; aspect-ratio: 3/4; border-radius: 14px; overflow: hidden; background: #1a1a22; border: 1px solid #262636; position: relative; margin-bottom: 8px; }
    .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
    .card-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(15,15,19,0.8); font-size: 10px; padding: 2px 6px; border-radius: 4px; border: 1px solid #262636; }
    .card-title { font-size: 12px; font-weight: 600; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 10px; color: #888; margin-top: 2px; }

    .show-detail { background: #1a1a22; border: 1px solid #262636; border-radius: 20px; padding: 20px; margin-bottom: 24px; display: flex; gap: 20px; flex-wrap: wrap; }
    .show-poster { width: 120px; height: 160px; object-fit: cover; border-radius: 12px; border: 1px solid #262636; }
    .show-info { flex: 1; min-width: 200px; display: flex; flex-direction: column; justify-content: space-between; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn { padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }
    .btn-primary { background: #6c5ce7; color: #fff; }
    .btn-secondary { background: #262636; color: #ccc; border: 1px solid #333; }

    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
    .ep-btn { background: #1a1a22; border: 1px solid #262636; color: #ccc; padding: 10px 0; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .ep-btn:hover { background: #6c5ce7; color: #fff; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #1a1a22; border: 1px solid #262636; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; }
    .hidden { display: none !important; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: #1a1a22; border: 1px solid #262636; padding: 14px; border-radius: 12px; width: 300px; z-index: 60; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .progress-bar { height: 6px; background: #262636; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; background: #6c5ce7; width: 0%; transition: width 0.2s; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo" onclick="showHome()">
        <div class="logo-box">D</div>
        <div class="logo-text">DRAMA<span>FLIX</span></div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search dramas...">
        <button onclick="handleSearch()">Search</button>
      </div>
    </div>
  </header>

  <main id="appContainer" class="main-container">
    <div style="text-align: center; padding: 80px 0; color: #888;">Homepage Loading...</div>
  </main>

  <!-- Custom Range Modal -->
  <div id="customModal" class="modal hidden">
    <div class="modal-box">
      <h3 style="color:#fff; font-size:16px; margin-bottom:6px;">Custom Range Download</h3>
      <p style="font-size:12px; color:#888; margin-bottom:14px;">Select episodes to download:</p>

      <div style="margin-bottom: 16px;">
        <label style="font-size:11px; color:#aaa; display:block; margin-bottom:4px;">Episodes Range</label>
        <input type="text" id="customInput" placeholder="e.g. 1-5, 8, 10" style="width:100%; padding:8px; background:#0f0f13; border:1px solid #262636; color:#fff; border-radius:8px; outline:none;">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeCustomModal()" class="btn btn-secondary">Cancel</button>
        <button onclick="startCustomDownload()" class="btn btn-primary">Start Download</button>
      </div>
    </div>
  </div>

  <!-- Download Status Toast -->
  <div id="downloadToast" class="toast hidden">
    <div style="font-size:12px; font-weight:bold; color:#fff;" id="toastTitle">Processing...</div>
    <div style="font-size:10px; color:#888;" id="toastSub">Preparing streams...</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>

  <!-- Native Video Player Overlay -->
  <div id="playerOverlay" class="modal hidden" style="background:#000; flex-direction:column; justify-content:center;">
    <button onclick="closePlayer()" style="position:absolute; top:16px; left:16px; z-index:60; background:#1a1a22; color:#fff; border:1px solid #262636; padding:8px 14px; border-radius:8px; cursor:pointer;">✕ Close</button>
    <div style="width:100%; max-width:480px; height:80vh; position:relative;">
      <video id="hlsVideoPlayer" controls playsinline style="width:100%; height:100%; border-radius:12px; background:#111;"></video>
    </div>
  </div>

  <script>
    const PROXY_BASE = "https://long-dream-ac6b.aaa39269012.workers.dev/?url=";
    const BASE_API = "https://storytvreal.vercel.app";

    let currentShow = null;
    let cachedEpisodeUrls = {};
    let hlsInstance = null;
    let isDownloading = false;

    function buildUrl(endpoint) {
      return PROXY_BASE + encodeURIComponent(BASE_API + endpoint);
    }

    // Direct Image Fix without breaking CORS headers
    function getProxyImg(url) {
      if (!url) return 'https://via.placeholder.com/140x180/1a1a22/ffffff?text=No+Cover';
      if (url.startsWith('http')) {
        return PROXY_BASE + encodeURIComponent(url);
      }
      return url;
    }

    window.addEventListener('DOMContentLoaded', () => {
      showHome();
    });

    function resolveUrl(base, rel) {
      try { return new URL(rel, base).href; } catch { return rel; }
    }

    async function fetchText(url) {
      const r = await fetch(PROXY_BASE + encodeURIComponent(url));
      if (!r.ok) throw new Error('HTTP Error ' + r.status);
      return r.text();
    }

    async function fetchBin(url) {
      const r = await fetch(PROXY_BASE + encodeURIComponent(url));
      if (!r.ok) throw new Error('Segment download failed');
      return new Uint8Array(await r.arrayBuffer());
    }

    async function showHome() {
      const container = document.getElementById('appContainer');
      container.innerHTML = `<div style="text-align: center; padding: 80px 0; color: #888;">Homepage loading...</div>`;
      
      try {
        const res = await fetch(buildUrl('/feedservice/v1/homepage/struct'));
        const json = await res.json();
        const sections = json.data?.sections || [];
        
        container.innerHTML = '';
        for (let section of sections) {
          renderCategorySection(container, section);
        }
      } catch (err) {
        container.innerHTML = `<div style="color:#ff6b6b; text-align:center; padding:40px;">Home page load karne mein error aayi.</div>`;
      }
    }

    async function renderCategorySection(parentEl, section) {
      const secDiv = document.createElement('div');
      secDiv.style.marginBottom = '28px';
      secDiv.innerHTML = `
        <div class="section-title">${section.text || 'Collection'}</div>
        <div id="cat-list-${section.id}" class="horizontal-scroll">
          <div style="font-size:12px; color:#666;">Loading...</div>
        </div>
      `;
      parentEl.appendChild(secDiv);

      try {
        const res = await fetch(buildUrl(`/feedservice/v1/shows/${section.id}?page=0&size=10`));
        const data = await res.json();
        const shows = data.data?.content || [];
        
        const listEl = document.getElementById(`cat-list-${section.id}`);
        listEl.innerHTML = '';
        shows.forEach(show => listEl.appendChild(createShowCard(show)));
      } catch (e) {
        console.error(e);
      }
    }

    function createShowCard(show) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = (e) => {
        e.stopPropagation();
        openShowDetail(show);
      };

      const imgUrl = getProxyImg(show.imageUrl);

      card.innerHTML = `
        <div class="card-img-box">
          <img src="${imgUrl}" alt="${show.title}" loading="lazy" crossorigin="anonymous" onerror="this.onerror=null; this.src='https://via.placeholder.com/140x180/1a1a22/ffffff?text=No+Cover';">
          <span class="card-badge">${show.watchInfo?.vc || '0'}</span>
        </div>
        <div class="card-title">${show.title}</div>
        <div class="card-sub">${show.watchInfo?.totalEpisodes || '0'} Episodes</div>
      `;
      return card;
    }

    function openShowDetail(show) {
      currentShow = show;
      cachedEpisodeUrls = {};
      const totalEpisodes = parseInt(show.watchInfo?.totalEpisodes || 0);
      const imgUrl = getProxyImg(show.imageUrl);

      const container = document.getElementById('appContainer');
      container.innerHTML = `
        <div class="show-detail">
          <img src="${imgUrl}" class="show-poster" crossorigin="anonymous" onerror="this.onerror=null; this.src='https://via.placeholder.com/120x160/262636/ffffff?text=No+Cover';">
          <div class="show-info">
            <div>
              <h2 style="font-size:20px; font-weight:bold; color:#fff;">${show.title}</h2>
              <p style="font-size:12px; color:#888; margin-top:6px;">${totalEpisodes} Episodes • ${show.watchInfo?.vc || '0'} Views</p>
            </div>
            <div class="btn-group">
              <button onclick="playEpisode(1)" class="btn btn-primary">▶ Play Ep 1</button>
              <button onclick="downloadAllEpisodes()" class="btn btn-secondary">⬇ Download All</button>
              <button onclick="openCustomModal()" class="btn btn-secondary">⚙ Custom Range</button>
            </div>
          </div>
        </div>

        <h3 style="font-size:14px; font-weight:bold; color:#fff; margin-bottom:12px;">EPISODES</h3>
        <div id="episodesGrid" class="episodes-grid"></div>
      `;

      const grid = document.getElementById('episodesGrid');
      for (let i = 1; i <= totalEpisodes; i++) {
        const epBtn = document.createElement('button');
        epBtn.className = 'ep-btn';
        epBtn.innerText = i;
        epBtn.onclick = () => playEpisode(i);
        grid.appendChild(epBtn);
      }
    }

    async function fetchEpisodeUrl(epIndex) {
      if (cachedEpisodeUrls[epIndex]) return cachedEpisodeUrls[epIndex];

      const cursor = Math.floor((epIndex - 1) / 5) * 5;
      const targetUrl = `/feedservice/v1/episode/metadata/${currentShow.id}?cursor=${cursor}&dir=NEXT`;
      
      try {
        const res = await fetch(buildUrl(targetUrl));
        const data = await res.json();
        const episodes = data.data?.content || [];
        episodes.forEach(item => {
          cachedEpisodeUrls[item.index] = item.epsUrl;
        });

        return cachedEpisodeUrls[epIndex] || null;
      } catch (err) {
        console.error(err);
        return null;
      }
    }

    // Modern Native HLS Playback Fix
    async function playEpisode(epIndex) {
      document.getElementById('playerOverlay').classList.remove('hidden');
      const videoEl = document.getElementById('hlsVideoPlayer');
      const rawM3u8 = await fetchEpisodeUrl(epIndex);

      if (!rawM3u8) {
        alert("Episode URL fetch nahi ho paaya!");
        return;
      }

      const streamUrl = PROXY_BASE + encodeURIComponent(rawM3u8);

      if (Hls.isSupported()) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play();
        });
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = streamUrl;
        videoEl.play();
      }
    }

    function closePlayer() {
      const videoEl = document.getElementById('hlsVideoPlayer');
      videoEl.pause();
      if (hlsInstance) hlsInstance.destroy();
      document.getElementById('playerOverlay').classList.add('hidden');
    }

    // Reliable TS Stream Direct Merger Downloader
    async function downloadEpisodeStream(masterUrl, filename) {
      updateStatus('M3U8 Playlist analyze ho rahi hai...', 10);
      const masterText = await fetchText(masterUrl);
      const lines = masterText.split(/\r?\n/).map(l => l.trim());

      let subPlaylist = null;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i] && !lines[i].startsWith('#')) {
          subPlaylist = resolveUrl(masterUrl, lines[i]);
          break;
        }
      }

      if (!subPlaylist) subPlaylist = masterUrl;

      updateStatus('Segments extract ho rahe hain...', 25);
      const subText = await fetchText(subPlaylist);
      const subLines = subText.split(/\r?\n/).map(l => l.trim());

      const segments = [];
      for (const line of subLines) {
        if (line && !line.startsWith('#')) {
          segments.push(resolveUrl(subPlaylist, line));
        }
      }

      if (segments.length === 0) throw new Error('Koi segments nahi mile!');

      const chunks = [];
      for (let i = 0; i < segments.length; i++) {
        const bin = await fetchBin(segments[i]);
        chunks.push(bin);
        const percent = Math.floor(25 + ((i + 1) / segments.length) * 70);
        updateStatus(`Downloading segment ${i + 1}/${segments.length}`, percent);
      }

      updateStatus('Merging video segments...', 98);
      const blob = new Blob(chunks, { type: 'video/mp2t' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${filename}.ts`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      updateStatus('Download Complete!', 100);
    }

    function updateStatus(text, progress) {
      document.getElementById('toastTitle').innerText = text;
      document.getElementById('toastSub').innerText = `${progress}% completed`;
      document.getElementById('progressBar').style.width = progress + '%';
    }

    async function downloadAllEpisodes() {
      const totalEps = parseInt(currentShow.watchInfo?.totalEpisodes || 0);
      const epList = Array.from({ length: totalEps }, (_, i) => i + 1);
      startSequentialDownload(epList);
    }

    function openCustomModal() { document.getElementById('customModal').classList.remove('hidden'); }
    function closeCustomModal() { document.getElementById('customModal').classList.add('hidden'); }

    function startCustomDownload() {
      const input = document.getElementById('customInput').value;
      const epList = parseCustomInput(input);
      closeCustomModal();
      if (epList.length > 0) startSequentialDownload(epList);
    }

    function parseCustomInput(input) {
      const result = new Set();
      input.split(',').forEach(part => {
        const trimmed = part.trim();
        if (trimmed.includes('-')) {
          const [start, end] = trimmed.split('-').map(Number);
          if (start && end) {
            for (let i = start; i <= end; i++) result.add(i);
          }
        } else if (!isNaN(trimmed) && trimmed !== '') {
          result.add(Number(trimmed));
        }
      });
      return Array.from(result).sort((a, b) => a - b);
    }

    async function startSequentialDownload(episodes) {
      if (isDownloading) return alert('Pehle se download queue chal rahi hai!');
      isDownloading = true;

      const toast = document.getElementById('downloadToast');
      toast.classList.remove('hidden');

      for (let i = 0; i < episodes.length; i++) {
        const epIndex = episodes[i];
        const masterUrl = await fetchEpisodeUrl(epIndex);
        
        if (masterUrl) {
          const filename = `${currentShow.title.replace(/[^a-zA-Z0-9]/g, "_")}_Ep_${epIndex}`;
          try {
            await downloadEpisodeStream(masterUrl, filename);
          } catch (err) {
            console.error('Download error:', err);
          }
        }
      }

      isDownloading = false;
      setTimeout(() => toast.classList.add('hidden'), 3000);
      alert('Sabhi chuney gaye Episodes Download ho chuke hain!');
    }

    async function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const container = document.getElementById('appContainer');
      container.innerHTML = `<div style="text-align:center; padding:40px; color:#888;">Searching...</div>`;

      try {
        const targetUrl = `/searchservice/v1/search/${encodeURIComponent(query)}?page=0&size=20`;
        const res = await fetch(buildUrl(targetUrl));
        const data = await res.json();
        const shows = data.data?.content || [];

        container.innerHTML = `<h2 class="section-title">Search Results</h2>`;
        const grid = document.createElement('div');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(130px, 1fr))';
        grid.style.gap = '14px';

        shows.forEach(show => grid.appendChild(createShowCard(show)));
        container.appendChild(grid);
      } catch (err) {
        container.innerHTML = `<div style="color:#ff6b6b; text-align:center; padding:20px;">Search fail ho gaya.</div>`;
      }
    }
  </script>
</body>
</html>
